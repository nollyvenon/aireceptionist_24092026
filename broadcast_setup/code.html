<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Promotion Broadcast</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#f7f9fb",
                    "tertiary-fixed": "#e1e0ff",
                    "on-tertiary-fixed-variant": "#2f2ebe",
                    "surface-container": "#eceef0",
                    "on-secondary-fixed-variant": "#004395",
                    "on-primary-container": "#7c839b",
                    "on-secondary-fixed": "#001a42",
                    "tertiary": "#000000",
                    "surface-tint": "#565e74",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#2170e4",
                    "tertiary-fixed-dim": "#c0c1ff",
                    "surface-container-highest": "#e0e3e5",
                    "surface-bright": "#f7f9fb",
                    "inverse-surface": "#2d3133",
                    "primary-fixed-dim": "#bec6e0",
                    "on-surface-variant": "#45464d",
                    "outline": "#76777d",
                    "on-tertiary-container": "#7073ff",
                    "primary": "#000000",
                    "on-secondary": "#ffffff",
                    "secondary-fixed-dim": "#adc6ff",
                    "on-primary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#07006c",
                    "error": "#ba1a1a",
                    "surface-container-high": "#e6e8ea",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "tertiary-container": "#07006c",
                    "outline-variant": "#c6c6cd",
                    "on-surface": "#191c1e",
                    "inverse-primary": "#bec6e0",
                    "primary-container": "#131b2e",
                    "secondary-fixed": "#d8e2ff",
                    "surface-container-low": "#f2f4f6",
                    "on-secondary-container": "#fefcff",
                    "on-background": "#191c1e",
                    "error-container": "#ffdad6",
                    "surface-dim": "#d8dadc",
                    "surface-variant": "#e0e3e5",
                    "on-primary-fixed-variant": "#3f465c",
                    "on-primary-fixed": "#131b2e",
                    "secondary": "#0058be",
                    "primary-fixed": "#dae2fd",
                    "background": "#f7f9fb",
                    "on-tertiary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "max-width": "600px",
                    "container-padding": "24px",
                    "section-margin": "32px",
                    "element-gap": "16px"
            },
            "fontFamily": {
                    "body-lg": [
                            "Inter"
                    ],
                    "headline-lg": [
                            "Inter"
                    ],
                    "headline-lg-mobile": [
                            "Inter"
                    ],
                    "caption": [
                            "Inter"
                    ],
                    "body-md": [
                            "Inter"
                    ],
                    "display-lg": [
                            "Inter"
                    ],
                    "label-md": [
                            "JetBrains Mono"
                    ],
                    "headline-md": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-lg-mobile": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "fontWeight": "600"
                            }
                    ],
                    "caption": [
                            "12px",
                            {
                                    "lineHeight": "16px",
                                    "fontWeight": "500"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-lg": [
                            "48px",
                            {
                                    "lineHeight": "56px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "label-md": [
                            "14px",
                            {
                                    "lineHeight": "20px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "500"
                            }
                    ],
                    "headline-md": [
                            "20px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "600"
                            }
                    ]
            }
    },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen pb-24 selection:bg-secondary selection:text-on-secondary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/70 shadow-sm flex items-center justify-between px-container-padding h-16 max-w-max-width mx-auto left-0 right-0">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-primary active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-on-surface">Promotion Broadcast</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant active:scale-95">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-container-padding max-w-max-width mx-auto flex flex-col gap-section-margin">
<!-- Target Segment Section -->
<section class="flex flex-col gap-3">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Target Segment</h2>
<div class="grid grid-cols-2 gap-3">
<label class="relative flex items-center p-4 bg-surface-container-lowest rounded-xl shadow-[0px_4px_16px_rgba(19,27,46,0.02)] border border-transparent has-[:checked]:border-secondary-container has-[:checked]:bg-surface transition-all cursor-pointer group">
<input checked="" class="peer sr-only" name="segment" type="radio" value="all"/>
<div class="flex flex-col gap-1">
<span class="font-body-md text-on-surface font-semibold">All Leads</span>
<span class="font-caption text-caption text-on-surface-variant">4,203 Contacts</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-secondary-container flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-secondary-container opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</label>
<label class="relative flex items-center p-4 bg-surface-container-lowest rounded-xl shadow-[0px_4px_16px_rgba(19,27,46,0.02)] border border-transparent has-[:checked]:border-secondary-container has-[:checked]:bg-surface transition-all cursor-pointer group">
<input class="peer sr-only" name="segment" type="radio" value="high_intent"/>
<div class="flex flex-col gap-1">
<span class="font-body-md text-on-surface font-semibold">High Intent</span>
<span class="font-caption text-caption text-on-surface-variant">842 Contacts</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-secondary-container flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-secondary-container opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</label>
<label class="relative flex items-center p-4 bg-surface-container-lowest rounded-xl shadow-[0px_4px_16px_rgba(19,27,46,0.02)] border border-transparent has-[:checked]:border-secondary-container has-[:checked]:bg-surface transition-all cursor-pointer group col-span-2">
<input class="peer sr-only" name="segment" type="radio" value="new"/>
<div class="flex flex-col gap-1">
<span class="font-body-md text-on-surface font-semibold">New This Week</span>
<span class="font-caption text-caption text-on-surface-variant">156 Contacts</span>
</div>
<div class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-secondary-container flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-secondary-container opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</label>
</div>
</section>
<!-- Message Composer Section -->
<section class="flex flex-col gap-3">
<div class="flex justify-between items-end">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Message Content</h2>
<button class="flex items-center gap-1.5 text-secondary-container font-label-md text-label-md hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[18px]" data-icon="smart_toy">smart_toy</span>
<span>AI Generate</span>
</button>
</div>
<div class="bg-surface-container-lowest rounded-[24px] shadow-[0px_4px_16px_rgba(19,27,46,0.02)] overflow-hidden flex flex-col focus-within:ring-2 focus-within:ring-secondary-container transition-all">
<textarea class="w-full bg-transparent border-none resize-none p-4 font-body-md text-on-surface min-h-[150px] placeholder:text-on-surface-variant/50 focus:ring-0" placeholder="Type your promotional message here...">Hi {LeadName}, we have a special offer for you this weekend!</textarea>
<div class="bg-surface-container-low px-4 py-3 flex items-center justify-between border-t border-surface-container-highest">
<div class="flex gap-2">
<button class="h-8 px-3 rounded-full bg-surface border border-outline-variant text-on-surface-variant font-label-md text-[12px] flex items-center gap-1 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[14px]" data-icon="add">add</span>
                            {LeadName}
                        </button>
<button class="h-8 w-8 rounded-full bg-surface border border-outline-variant text-on-surface-variant flex items-center justify-center hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="image">image</span>
</button>
<button class="h-8 w-8 rounded-full bg-surface border border-outline-variant text-on-surface-variant flex items-center justify-center hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="sentiment_satisfied">sentiment_satisfied</span>
</button>
</div>
<span class="font-caption text-caption text-on-surface-variant">64/160</span>
</div>
</div>
</section>
<!-- Target Platform Section -->
<section class="flex flex-col gap-3">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Target Platform</h2>
<div class="flex gap-3 overflow-x-auto pb-2 -mx-container-padding px-container-padding snap-x">
<label class="snap-start shrink-0 relative flex flex-col items-center justify-center p-4 bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_16px_rgba(19,27,46,0.02)] border border-transparent has-[:checked]:border-secondary-container has-[:checked]:bg-surface transition-all cursor-pointer w-[120px] h-[100px]">
<input checked="" class="peer sr-only" name="platform" type="checkbox" value="whatsapp"/>
<span class="material-symbols-outlined text-[32px] text-[#25D366] mb-2" data-icon="chat">chat</span> <!-- Using standard icon for WhatsApp placeholder -->
<span class="font-caption text-caption text-on-surface font-semibold">WhatsApp</span>
</label>
<label class="snap-start shrink-0 relative flex flex-col items-center justify-center p-4 bg-surface-container-lowest rounded-[16px] shadow-[0px_4px_16px_rgba(19,27,46,0.02)] border border-transparent has-[:checked]:border-secondary-container has-[:checked]:bg-surface transition-all cursor-pointer w-[120px] h-[100px]">
<input class="peer sr-only" name="platform" type="checkbox" value="instagram"/>
<span class="material-symbols-outlined text-[32px] text-[#E1306C] mb-2" data-icon="photo_camera">photo_camera</span> <!-- Using standard icon for IG placeholder -->
<span class="font-caption text-caption text-on-surface font-semibold">Instagram</span>
</label>
</div>
</section>
<!-- Delivery Option Section -->
<section class="flex flex-col gap-3">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Delivery</h2>
<div class="bg-surface-container-lowest rounded-[24px] shadow-[0px_4px_16px_rgba(19,27,46,0.02)] p-1 flex">
<label class="flex-1 text-center cursor-pointer relative z-10">
<input checked="" class="peer sr-only" name="schedule" onchange="document.getElementById('schedule-options').classList.add('hidden')" type="radio" value="now"/>
<div class="py-3 px-4 font-body-md text-on-surface-variant font-medium peer-checked:text-on-primary transition-colors rounded-[20px] peer-checked:bg-primary">
                        Send Now
                    </div>
</label>
<label class="flex-1 text-center cursor-pointer relative z-10">
<input class="peer sr-only" name="schedule" onchange="document.getElementById('schedule-options').classList.remove('hidden')" type="radio" value="later"/>
<div class="py-3 px-4 font-body-md text-on-surface-variant font-medium peer-checked:text-on-primary transition-colors rounded-[20px] peer-checked:bg-primary">
                        Schedule
                    </div>
</label>
</div>
<div class="hidden mt-2 bg-surface-container-lowest p-4 rounded-[16px] shadow-[0px_4px_16px_rgba(19,27,46,0.02)] flex gap-3" id="schedule-options">
<div class="flex-1 bg-surface rounded-[8px] border border-outline-variant px-3 py-2 flex items-center justify-between">
<span class="font-body-md text-on-surface">Oct 24, 2023</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
</div>
<div class="flex-1 bg-surface rounded-[8px] border border-outline-variant px-3 py-2 flex items-center justify-between">
<span class="font-body-md text-on-surface">10:00 AM</span>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="schedule">schedule</span>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md border-t border-surface-container shadow-[0px_-4px_16px_rgba(19,27,46,0.05)] p-4 flex gap-3 z-40 max-w-max-width mx-auto right-0 pb-6">
<button class="flex-1 py-4 bg-surface-container-lowest border border-outline-variant text-primary font-body-md font-semibold rounded-[24px] hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
            Preview
        </button>
<button class="flex-[2] py-4 bg-primary text-on-primary font-body-md font-semibold rounded-[24px] hover:opacity-90 transition-opacity flex items-center justify-center gap-2 shadow-sm">
<span class="material-symbols-outlined" data-icon="send">send</span>
            Send Broadcast
        </button>
</div>
</body></html>
