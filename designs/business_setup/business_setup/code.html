<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Connect Your Business - AI Assistant Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>

                    "inverse-primary": "#bec6e0",
                    "outline": "#76777d",
                    "secondary-fixed-dim": "#adc6ff",
                    "secondary": "#0058be",
                    "secondary-container": "#2170e4",
                    "primary-fixed": "#dae2fd",
                    "surface-variant": "#e0e3e5",
                    "on-background": "#191c1e",
                    "on-secondary-fixed-variant": "#004395",
                    "error-container": "#ffdad6",
                    "on-primary-fixed-variant": "#3f465c",
                    "tertiary-fixed": "#e1e0ff",
                    "on-surface": "#191c1e",
                    "surface-container-high": "#e6e8ea",
                    "primary": "#000000",
                    "inverse-on-surface": "#eff1f3",
                    "on-secondary-fixed": "#001a42",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed": "#07006c",
                    "on-tertiary-container": "#7073ff",
                    "surface-container": "#eceef0",
                    "on-secondary-container": "#fefcff",

                    "on-primary-container": "#7c839b",

            },
            "spacing": {
                    "base": "8px",
                    "container-padding": "24px",
                    "max-width": "600px",
                    "section-margin": "32px",
                    "element-gap": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .progress-bar-fill {
            transition: width 0.5s ease-in-out;
        }

        .input-glow:focus {
            box-shadow: 0 0 0 2px #2170e4;
            border-color: #2170e4;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface h-full flex flex-col font-body-md antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-container-padding w-full max-w-max-width mx-auto">
<div class="w-full glass-panel rounded-[24px] p-8 shadow-[0px_4px_16px_rgba(0,0,0,0.04)] relative overflow-hidden">
<!-- Progress Indicator -->
<div class="mb-section-margin">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Step 2 of 3</span>
<span class="font-label-md text-label-md text-on-surface-variant">Setup</span>
</div>
<div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full progress-bar-fill" style="width: 66%;"></div>
</div>
</div>
<!-- Header -->
<div class="mb-section-margin text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Connect Your Business</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Provide details so the AI can tailor its responses to your specific operations.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-element-gap">
<!-- Company Name -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="companyName">Company Name</label>
<input class="w-full bg-surface-container-low border-none rounded-[16px] p-4 text-on-surface focus:ring-0 input-glow transition-shadow" id="companyName" placeholder="e.g. Acme Corp" type="text"/>
</div>
<!-- Business Type -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="businessType">Business Type</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-none rounded-[16px] p-4 text-on-surface appearance-none focus:ring-0 input-glow transition-shadow" id="businessType">
<option disabled="" selected="" value="">Select industry...</option>
<option value="tech">Technology / Software</option>
<option value="retail">Retail / E-commerce</option>
<option value="service">Professional Services</option>
<option value="healthcare">Healthcare</option>
<option value="other">Other</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div class="h-px bg-surface-container-highest my-4"></div>
<!-- Knowledge Base Section -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2">Business Knowledge Base</label>
<p class="font-caption text-caption text-on-surface-variant mb-4">Upload documents or provide a URL for the AI to learn your processes, FAQs, and brand guidelines.</p>
<div class="flex flex-col md:flex-row gap-4">
<!-- URL Input -->
<div class="flex-grow">
<div class="relative">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 20px;">link</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-[16px] py-4 pl-12 pr-4 text-on-surface focus:ring-0 input-glow transition-shadow" placeholder="https://docs.yourcompany.com" type="url"/>
</div>
</div>
<div class="flex items-center justify-center font-label-md text-label-md text-on-surface-variant">OR</div>
<!-- File Upload Button -->
<div>
<button class="w-full md:w-auto flex items-center justify-center gap-2 bg-surface-container-low text-primary px-6 py-4 rounded-[16px] border border-outline-variant hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">upload_file</span>
<span class="font-label-md text-label-md">Upload PDF/Doc</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="mt-section-margin pt-4 flex flex-col sm:flex-row gap-4 justify-end items-center">
<button class="w-full sm:w-auto font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors px-6 py-4" type="button">
                        Back
                    </button>
<button class="w-full sm:w-auto bg-primary text-on-primary font-label-md text-label-md rounded-full px-8 py-4 shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
                        Continue
                        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
</body></html>
