<button class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant/30 hover:opacity-80 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a confident agency owner in a bright, modern corporate office setting, lit with soft natural light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBNPGbjpkmRGALXqLf-uCU_htMYB6gOoGqYjAK6f2E-w_i1_iSWX0W0FKivXwquSgo80-eGeLD5huXrP4R2_mSW3JvQalCszsU45__WdSuP8sQuaIj8eFb4puA8C1SQVTsIgIIHSyGBeXVNsInVFZjNbWIi2_JxeYeq-yWkhsynkavN2vMa3u-zfYOxsUmGbXVctGyQaBartAkRG-MzFlslXlx9cGFLEsV5afQqJlhZfv3oyylCcP5jgA"/>

<!-- Main Content Canvas -->

<!-- Screen Title -->
<header class="flex flex-col gap-base">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Auto-Pay Setup</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Configure automated billing cycles and payment preferences for your clients.</p>
</header>
<!-- Configuration Toggles -->
<section class="flex flex-col gap-element-gap">
<h3 class="font-headline-md text-headline-md text-on-surface">Rules Engine</h3>
<!-- Toggle 1: Enable Auto-Charging -->
<label class="flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,26,66,0.04)] border-l-2 border-primary cursor-pointer active:scale-[0.99] transition-transform">
<div class="flex flex-col pr-4">
<span class="font-label-md text-label-md text-on-surface">Enable Auto-Charging</span>
<span class="font-caption text-caption text-on-surface-variant mt-1">Automatically draft funds on invoice due date.</span>
</div>
<div class="relative inline-flex items-center flex-shrink-0">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
</label>
<!-- Toggle 2: Retry Failed Payments -->
<label class="flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,26,66,0.04)] cursor-pointer active:scale-[0.99] transition-transform">
<div class="flex flex-col pr-4">
<span class="font-label-md text-label-md text-on-surface">Retry Failed Payments</span>
<span class="font-caption text-caption text-on-surface-variant mt-1">Attempt re-charge after 3 and 7 days.</span>
</div>
<div class="relative inline-flex items-center flex-shrink-0">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
</label>
<!-- Toggle 3: Late Fee Logic -->
<label class="flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl shadow-[0_4px_16px_rgba(0,26,66,0.04)] cursor-pointer active:scale-[0.99] transition-transform">
<div class="flex flex-col pr-4">
<span class="font-label-md text-label-md text-on-surface">Late Fee Logic</span>
<span class="font-caption text-caption text-on-surface-variant mt-1">Apply 5% fee after 5 days past due.</span>
</div>
<div class="relative inline-flex items-center flex-shrink-0">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
</label>

<h3 class="font-headline-md text-headline-md text-on-surface">Preferred Method</h3>

<div class="absolute top-2 right-2 w-5 h-5 bg-primary rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary" style="font-size: 14px; font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Method: Bank Transfer (Unselected) -->

<span class="material-symbols-outlined text-4xl">account_balance</span>
<span class="font-label-md text-label-md">Bank Transfer</span>
</button>
</div>
