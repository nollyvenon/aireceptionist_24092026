[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    integration: Integration tests requiring database
    unit: Unit tests with mocks
    auth: Authentication tests
    crm: CRM module tests
    communication: Communication (calls, voicemails) tests
    appointments: Appointment booking tests
    payments: Payment processing tests
    analytics: Analytics and reporting tests
asyncio_mode = auto

# PostgreSQL configuration for pytest-postgresql
postgresql_host = localhost
postgresql_port = 5432
postgresql_user = postgres
postgresql_password = 
postgresql_db = test_glacier_ai
