version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: glacier_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-glacier_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-glacier_password}
      POSTGRES_DB: ${DB_NAME:-glacier_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glacier_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: glacier_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python Backend (FastAPI)
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: glacier_backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-glacier_user}:${DB_PASSWORD:-glacier_password}@postgres:5432/${DB_NAME:-glacier_ai}
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
      PYTHONUNBUFFERED: 1
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: glacier_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: ${NODE_ENV:-development}
    volumes:
      - ./pages:/app/pages
      - ./components:/app/components
      - ./styles:/app/styles
      - ./public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: glacier_network
